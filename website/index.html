<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- wet-ink-compiler -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#faeee1" />
    <meta
      name="description"
      content="the fastest x86 and x86-64 cpu emulator for javascript runtimes."
    />
    <title>ring64</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="./assets/fonts/national-park.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./assets/fonts/newsreader-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="shell home-shell">
      <!-- site-masthead -->

      <main class="landing">
        <div class="project-overview">
          <div class="project-heading">
            <h1 class="project-slogan">
              the <a href="./benchmarks/">fastest</a> x86 cpu emulator<br />
              for javascript runtimes
            </h1>
          </div>
          <div class="project-details">
            <p class="project-summary">32-bit and 64-bit x86.</p>
            <div class="install">
              <code id="install-command">npm install ring64</code>
              <button
                type="button"
                id="copy-install"
                data-copy-code="install-command"
                class="icon-button"
                aria-label="copy install command"
                title="copy install command"
                hidden
              >
                <svg
                  class="copy-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.6"
                  aria-hidden="true"
                >
                  <rect x="8" y="8" width="12" height="12" rx="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
                </svg>
                <svg
                  class="copied-icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <path d="m5 12 4 4 10-10" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
              <span id="copy-status" class="visually-hidden" role="status"></span>
            </div>
          </div>
        </div>
        <figure class="wet-ink" aria-labelledby="wet-ink-title">
          <figcaption class="ink-caption">
            <h2 id="wet-ink-title">wet ink<sup class="ink-note-mark" aria-hidden="true">*</sup></h2>
            <p>
              <span class="ink-note-mark" aria-hidden="true">*</span>
              ink folds into itself. where you pass, the edges unravel.
            </p>
          </figcaption>
          <!-- wet-ink-canvas -->
          <div class="ink-toolbar">
            <a class="ink-note-link" href="./under-the-ink/">
              <span class="ink-note-mark" aria-hidden="true">*</span>
              <span>under the ink</span>
            </a>
            <!-- wet-ink-controls -->
          </div>
        </figure>
      </main>

      <footer class="colophon">
        <a href="./assets/wet-ink/wet-ink.bin" download="wet-ink.x86-64.bin">wet ink binary</a>
        <p class="signature">built by <a href="https://fatihguzel.dev/">fatih guzel</a></p>
        <a class="source" href="https://github.com/fatihguzeldev/ring64">source on github</a>
      </footer>
    </div>
    <script type="module" src="./site.js"></script>
    <script type="module" src="./wet-ink/index.js"></script>
  </body>
</html>
