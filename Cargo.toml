[package]
name = "ring64"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
rustc_apfloat = "=0.2.3"
serde_json = "1.0"
wasm-encoder = { version = "=0.259.0", default-features = false, features = ["std"] }

[dev-dependencies]
wasmparser = "=0.259.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
