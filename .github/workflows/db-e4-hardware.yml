name: DB E4 hardware verification

on:
  push:
    branches: [db-e4-hardware]

permissions:
  contents: read

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, slot: 1 }
          - { runner: ubuntu-24.04, slot: 2 }
          - { runner: ubuntu-24.04, slot: 3 }
          - { runner: ubuntu-24.04, slot: 4 }
          - { runner: macos-26-intel, slot: 1 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    defaults:
      run:
        working-directory: tools/db-e4-reference
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Locate a real Intel runner
        id: vendor
        run: |
          test "$(uname -m)" = x86_64
          if [[ "$(uname -s)" == Linux ]]; then
            lscpu | tee host.txt
          else
            test "$(sysctl -in sysctl.proc_translated || true)" != 1
            sysctl -n machdep.cpu.vendor machdep.cpu.brand_string machdep.cpu.family machdep.cpu.model machdep.cpu.stepping | tee host.txt
            sysctl kern.hv_support | tee -a host.txt
          fi
          if grep -q GenuineIntel host.txt; then echo 'intel=true' >> "$GITHUB_OUTPUT"; fi
      - name: Build and measure on Intel KVM or HVF
        if: steps.vendor.outputs.intel == 'true'
        run: |
          build="$RUNNER_TEMP"
          if [[ "$(uname -s)" == Linux ]]; then
            sudo test -c /dev/kvm
            if ! command -v qemu-system-x86_64; then
              sudo apt-get -qq update
              sudo apt-get -qq install -y --no-install-recommends qemu-system-x86
            fi
            compiler=(gcc -m32)
            linker=(ld)
            launch=(sudo timeout 35s qemu-system-x86_64 -accel kvm)
          else
            test "$(sysctl -n kern.hv_support)" = 1
            if ! command -v qemu-system-x86_64; then
              HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install qemu
            fi
            compiler=(clang --target=i386-unknown-none-elf)
            sysroot="$(rustc --print sysroot)"
            target="$(rustc -vV | sed -n 's/^host: //p')"
            linker=("$sysroot/lib/rustlib/$target/bin/rust-lld" -flavor gnu)
            launch=(qemu-system-x86_64 -accel hvf)
          fi
          "${compiler[@]}" -c db-e4-boot.S -o "$build/boot.o"
          "${compiler[@]}" -std=c11 -O2 -ffreestanding -fno-builtin -fno-pie -fno-stack-protector -mno-sse -mno-mmx -msoft-float -Wall -Wextra -Werror -c db-e4-ring0.c -o "$build/probe.o"
          "${linker[@]}" -m elf_i386 -T db-e4-boot.ld "$build/boot.o" "$build/probe.o" -o "$build/probe.elf"
          set +e
          "${launch[@]}" -cpu host -m 64 -display none -monitor none -serial stdio -no-reboot -device isa-debug-exit,iobase=0xf4,iosize=4 -kernel "$build/probe.elf" > probe.txt 2> qemu.stderr
          result=$?
          set -e
          cat qemu.stderr
          cat probe.txt
          test "$result" = 3
          grep '^guest vendor=GenuineIntel ' probe.txt
          grep '^probe-complete cases=80$' probe.txt
          python3 db-e4-verify.py probe.txt > verified.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: db-e4-intel-${{ matrix.runner }}-${{ matrix.slot }}
          path: |
            tools/db-e4-reference/host.txt
            tools/db-e4-reference/probe.txt
            tools/db-e4-reference/qemu.stderr
            tools/db-e4-reference/verified.json
